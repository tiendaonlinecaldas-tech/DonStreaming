<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming IPTV</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="brand-header">
        <div class="logo-box-login">
          <img id="login-logo" src="logo.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3163/3163478.png';" alt="Don Streaming Logo">
        </div>
        <h2>Don Streaming <span>IPTV</span></h2>
        <p>Plataforma de reproducción streaming</p>
      </div>

      <div class="login-tabs">
        <button type="button" id="tab-fast" class="tab-btn active" onclick="switchTab('fast')">🔑 Usuario / Clave</button>
        <button type="button" id="tab-m3u" class="tab-btn" onclick="switchTab('m3u')">🔗 URL M3U</button>
      </div>

      <form id="form-fast" class="login-form">
        <div class="input-group">
          <label>URL del Servidor / DNS</label>
          <input type="text" id="fast-server" placeholder="http://servidor.com:8080" required>
        </div>
        <div class="input-group">
          <label>Usuario IPTV</label>
          <input type="text" id="fast-user" placeholder="Tu usuario" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="fast-pass" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary">🚀 Iniciar Sesión</button>
      </form>

      <form id="form-m3u" class="login-form hidden">
        <div class="input-group">
          <label>URL Directa M3U</label>
          <input type="url" id="m3u-url-input" placeholder="http://servidor.com/get.php?username=...">
        </div>
        <button type="submit" class="btn btn-primary">Cargar Lista Directa</button>
      </form>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="app-screen" class="screen hidden">
    <header class="navbar">
      <div class="nav-brand">
        <img id="nav-logo" class="nav-logo-img" src="logo.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3163/3163478.png';" alt="Logo">
        <span class="brand-name">Don Streaming</span>
      </div>
      <div class="nav-actions">
        <button id="proxy-toggle-btn" class="btn-action btn-proxy" onclick="toggleProxyMode()">⚡ Proxy: OFF</button>
        <button id="reload-btn" class="btn-action">🔄 Recargar Lista</button>
        <button id="logout-btn" class="btn-action btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="content-tabs">
            <button id="nav-live" class="tab-nav active" onclick="setMode('live')">📺 Canales</button>
            <button id="nav-movie" class="tab-nav" onclick="setMode('movie')">🎬 Películas</button>
            <button id="nav-series" class="tab-nav" onclick="setMode('series')">🍿 Series</button>
          </div>

          <div class="search-wrapper">
            <input type="text" id="search-channel" placeholder="🔍 Buscar contenido...">
          </div>

          <div class="filter-wrapper">
            <select id="category-select">
              <option value="ALL">Cargando categorías...</option>
            </select>
          </div>
        </div>

        <div class="list-container">
          <ul id="channel-list" class="channel-list"></ul>
        </div>
      </aside>

      <section class="player-section">
        <div class="player-wrapper">
          <video id="video-player" controls autoplay playsinline></video>
        </div>

        <div class="now-playing-bar">
          <div class="channel-meta">
            <div class="logo-box">
              <img id="current-channel-logo" src="https://cdn-icons-png.flaticon.com/512/3163/3163478.png" alt="Logo Canal">
            </div>
            <div class="channel-details">
              <h3 id="current-channel-title">Selecciona un contenido</h3>
              <p id="current-channel-status" class="status-indicator">En espera...</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
