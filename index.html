<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming IPTV</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- PANTALLA DE LOGIN UNIFICADA -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <img src="logo.png" alt="Don Streaming" class="login-logo" onerror="this.src='lgo.png'">
      <h2>Don Streaming IPTV</h2>
      <p class="login-subtitle">Ingresa las credenciales de tu servicio</p>

      <form id="formLogin" onsubmit="iniciarSesion(event)">
        <div class="input-group">
          <label>URL del Servidor / Host</label>
          <input type="text" id="serverUrl" placeholder="http://ejemplo.com:80" required>
        </div>
        <div class="input-group">
          <label>Usuario</label>
          <input type="text" id="username" placeholder="Tu usuario" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-login">🚀 Iniciar Sesión</button>
      </form>

      <div id="errorMessage" class="error-box hidden"></div>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="appContainer" class="app-container hidden">
    <header class="top-bar">
      <div class="brand-box">
        <img src="logo.png" alt="Don Streaming" class="header-logo" onerror="this.src='lgo.png'">
        <span class="brand-title">Don Streaming</span>
      </div>
      <div class="info-box">
        <span id="clockDisplay">12:00 PM</span>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <main class="smarters-grid">
      <div class="tile tile-live" onclick="abrirSeccion('live')">
        <div class="tile-icon">📺</div>
        <div class="tile-title">LIVE TV</div>
      </div>
      <div class="tile tile-movies" onclick="abrirSeccion('movies')">
        <div class="tile-icon">🎬</div>
        <div class="tile-title">MOVIES</div>
      </div>
      <div class="tile tile-series" onclick="abrirSeccion('series')">
        <div class="tile-icon">🎞️</div>
        <div class="tile-title">SERIES</div>
      </div>
      <div class="tile tile-small" onclick="alert('Sección en mantenimiento')">
        <div class="tile-icon">⏱️</div>
        <div class="tile-title-small">CATCH UP</div>
      </div>
      <div class="tile tile-small" onclick="alert('Sección en mantenimiento')">
        <div class="tile-icon">🖥️</div>
        <div class="tile-title-small">MULTISCREEN</div>
      </div>
      <div class="tile tile-small" onclick="alert('Ajustes del sistema')">
        <div class="tile-icon">⚙️</div>
        <div class="tile-title-small">SETTINGS</div>
      </div>
    </main>

    <footer class="footer-bar">
      <span id="userLogged">Logged in : Demo</span>
    </footer>
  </div>

  <!-- VISTA DEL REPRODUCTOR Y CANALES -->
  <div id="playerView" class="player-view hidden">
    <header class="player-header">
      <button onclick="volverAlMenu()" class="btn-back">⬅️ Volver al Menú</button>
      <h3 id="sectionTitle">Canales de TV</h3>
    </header>

    <div class="player-content">
      <aside class="channel-sidebar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Buscar canal o película..." oninput="filtrarCanales()">
        </div>
        <div id="channelList" class="channel-list">
          <p class="loading-text">Cargando lista...</p>
        </div>
      </aside>

      <main class="video-container">
        <div class="video-wrapper">
          <video id="mainVideoPlayer" controls autoplay playsinline></video>
        </div>
        <div class="now-playing">
          <h4 id="currentChannelTitle">Selecciona un canal para reproducir</h4>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
