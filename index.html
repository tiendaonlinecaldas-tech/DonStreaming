<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming Player</title>
  
  <!-- HLS Player Engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #080c14; color: #ffffff; min-height: 100vh; overflow: hidden; }
    .hidden { display: none !important; }

    /* PANTALLA LOGIN / CONFIGURACIÓN LOGO */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: radial-gradient(circle, #1e293b 0%, #080c14 100%); }
    .app-card {
      background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      padding: 30px; width: 100%; max-width: 450px; text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    .brand-logo-preview { width: 100px; height: 100px; object-fit: contain; margin: 0 auto 15px auto; border-radius: 12px; background: #1e293b; padding: 5px; border: 1px solid #334155; }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #64748b; margin-bottom: 20px; }

    .input-group { text-align: left; margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; font-size: 12px; outline: none; }
    .input-group input:focus { border-color: #6366f1; }

    .btn-action { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
    .btn-action:hover { transform: scale(1.02); }

    .status-msg { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 12px; }
    .status-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .status-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }

    /* REPRODUCTOR ESTILO SMARTERS PRO */
    .player-view { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #000; position: fixed; top: 0; left: 0; z-index: 9999; }
    .player-header { padding: 10px 20px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-logo { height: 35px; width: auto; max-width: 120px; object-fit: contain; }
    .btn-back { background: #ef4444; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }

    .player-content { display: flex; flex: 1; overflow: hidden; }
    .channel-sidebar { width: 320px; background: #0f172a; padding: 12px; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
    .search-box { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; font-size: 12px; margin-bottom: 10px; }
    .channel-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }

    .channel-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.03); border: 1px solid transparent; transition: all 0.2s; }
    .channel-item:hover, .channel-item.active { background: #6366f1; color: #fff; font-weight: bold; }
    .channel-icon { width: 38px; height: 38px; border-radius: 6px; object-fit: contain; background: #1e293b; padding: 2px; }
    .channel-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

    /* ÁREA DE VIDEO Y BOTÓN DE PANTALLA COMPLETA */
    .video-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; position: relative; }
    video { width: 100%; height: 100%; max-height: 85vh; background: #000; }

    .video-controls-overlay { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; }
    .btn-fullscreen { background: rgba(99, 102, 241, 0.8); border: none; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; backdrop-filter: blur(5px); }
    .btn-fullscreen:hover { background: #6366f1; }
  </style>
</head>
<body>

  <!-- PANTALLA DE CONFIGURACIÓN E INGRESO -->
  <div id="mainScreen" class="login-container">
    <div class="app-card">
      <img id="logoPreview" src="https://via.placeholder.com/100?text=DON+STREAMING" class="brand-logo-preview" alt="Logo Business">
      
      <h2>Don Streaming Player</h2>
      <p class="subtitle">Panel de Reproducción IPTV</p>

      <div class="input-group">
        <label>URL del Logo Personalizado (Opcional):</label>
        <input type="text" id="customLogoUrl" placeholder="https://tu-imagen.com/logo.png" oninput="actualizarLogoPreview()">
      </div>

      <div class="input-group">
        <label>Servidor / Host:</label>
        <input type="text" id="xtreamHost" value="http://aioplus.es:80">
      </div>
      <div class="input-group">
        <label>Usuario:</label>
        <input type="text" id="xtreamUser" value="MAUROIPTV">
      </div>
      <div class="input-group">
        <label>Contraseña:</label>
        <input type="password" id="xtreamPass" value="MAURO121672">
      </div>

      <button class="btn-action" onclick="conectarXtreamAPI()">🚀 Cargar Lista de Canales</button>

      <div id="statusBox" class="status-msg hidden"></div>
    </div>
  </div>

  <!-- REPRODUCTOR -->
  <div id="playerView" class="player-view hidden">
    <header class="player-header">
      <div class="header-brand">
        <img id="appHeaderLogo" src="https://via.placeholder.com/100?text=DS" class="header-logo" alt="Logo Header">
        <h3 id="playerTitle">Don Streaming IPTV</h3>
      </div>
      <button onclick="cerrarReproductor()" class="btn-back">🚪 Salir</button>
    </header>

    <div class="player-content">
      <aside class="channel-sidebar">
        <input type="text" id="searchChannel" class="search-box" placeholder="🔍 Buscar canal..." oninput="filtrarCanales()">
        <div id="channelList" class="channel-list"></div>
      </aside>

      <main class="video-container" id="videoWrapper">
        <video id="videoPlayer" controls autoplay playsinline></video>
        
        <div class="video-controls-overlay">
          <button class="btn-fullscreen" onclick="togglePantallaCompleta()">⛶ Pantalla Completa</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    let loadedChannels = [];
    let hls = null;

    function actualizarLogoPreview() {
      const url = document.getElementById('customLogoUrl').value.trim();
      const defaultLogo = 'https://via.placeholder.com/100?text=DON+STREAMING';
      document.getElementById('logoPreview').src = url || defaultLogo;
      document.getElementById('appHeaderLogo').src = url || defaultLogo;
    }

    async function conectarXtreamAPI() {
      let host = document.getElementById('xtreamHost').value.trim();
      const user = document.getElementById('xtreamUser').value.trim();
      const pass = document.getElementById('xtreamPass').value.trim();

      if (!host || !user || !pass) return showStatus('Completa Servidor, Usuario y Contraseña', 'error');

      if (!host.startsWith('http://') && !host.startsWith('https://')) host = 'http://' + host;
      if (host.endsWith('/')) host = host.slice(0, -1);

      showStatus('⏳ Conectando y obteniendo lista de canales con logos...', 'success');

      const targetApi = `${host}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
      
      try {
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetApi)}`;
        const res = await fetch(proxyUrl);
        if (res.ok) {
          const streams = await res.json();
          if (Array.isArray(streams) && streams.length > 0) {
            loadedChannels = streams.map(s => ({
              name: s.name,
              icon: s.stream_icon || 'https://via.placeholder.com/38?text=TV',
              rawUrl: `${host}/live/${user}/${pass}/${s.stream_id}.m3u8`
            }));
            showStatus(`¡Éxito! ${loadedChannels.length} canales listos.`, 'success');
            setTimeout(() => abrirReproductor(), 400);
            return;
          }
        }
      } catch(e) {}

      showStatus('❌ Error de conexión o credenciales vencidas.', 'error');
    }

    function abrirReproductor() {
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('playerView').classList.remove('hidden');
      renderizarListaCanales(loadedChannels);
    }

    function cerrarReproductor() {
      if (hls) hls.destroy();
      document.getElementById('videoPlayer').pause();
      document.getElementById('playerView').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
    }

    function renderizarListaCanales(lista) {
      const container = document.getElementById('channelList');
      container.innerHTML = '';
      lista.slice(0, 300).forEach(item => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.innerHTML = `
          <img src="${item.icon}" class="channel-icon" onerror="this.src='https://via.placeholder.com/38?text=TV'">
          <span class="channel-name">${item.name}</span>
        `;
        div.onclick = () => reproducirCanal(item, div);
        container.appendChild(div);
      });
    }

    function filtrarCanales() {
      const query = document.getElementById('searchChannel').value.toLowerCase();
      const filtered = loadedChannels.filter(c => c.name.toLowerCase().includes(query));
      renderizarListaCanales(filtered);
    }

    function reproducirCanal(item, element) {
      document.querySelectorAll('.channel-item').forEach(e => e.classList.remove('active'));
      if (element) element.classList.add('active');
      
      const video = document.getElementById('videoPlayer');
      if (hls) hls.destroy();

      // Proxy HLS que resuelve la restricción HTTP/HTTPS
      const proxiedStream = `https://corsproxy.io/?${encodeURIComponent(item.rawUrl)}`;

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(proxiedStream);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = proxiedStream;
        video.play().catch(() => {});
      }
    }

    function togglePantallaCompleta() {
      const elem = document.getElementById('videoWrapper');
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.innerText = msg;
      box.className = `status-msg ${type === 'success' ? 'status-success' : 'status-error'}`;
      box.classList.remove('hidden');
    }
  </script>
</body>
</html>
