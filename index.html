<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming IPTV - Sistema de Activación</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #080c14;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hidden { display: none !important; }

    .app-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .logo-box {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px auto;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 20px; }

    /* NAVEGACIÓN ENTRE CLIENTE Y ADMIN */
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      background: #1e293b;
      padding: 4px;
      border-radius: 10px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    .nav-btn.active {
      background: #6366f1;
      color: #ffffff;
    }

    /* TARJETA MAC / KEY CLIENTE */
    .device-box {
      background: rgba(30, 41, 59, 0.6);
      border: 2px dashed #38bdf8;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: left;
    }

    .device-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .device-row:last-child { margin-bottom: 0; }
    .device-row label { color: #94a3b8; font-size: 13px; }
    .device-row span { color: #38bdf8; font-family: monospace; font-size: 16px; font-weight: bold; }

    .input-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #090d16;
      color: #fff;
      font-size: 13px;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
    }

    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .status-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .status-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }

    /* REPRODUCTOR */
    .player-view { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #000; }
    .player-header { padding: 12px 20px; background: #0f172a; display: flex; gap: 15px; align-items: center; }
    .btn-back { background: #ef4444; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .player-content { display: flex; flex: 1; overflow: hidden; }
    .channel-sidebar { width: 300px; background: #0f172a; padding: 12px; display: flex; flex-direction: column; }
    .channel-list { flex: 1; overflow-y: auto; margin-top: 10px; }
    .channel-item { padding: 10px; border-radius: 6px; cursor: pointer; background: rgba(255,255,255,0.03); margin-bottom: 5px; font-size: 13px; }
    .channel-item:hover, .channel-item.active { background: #6366f1; }
    .video-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; }
    video { width: 100%; height: 80vh; }
  </style>
</head>
<body>

  <!-- PANTALLA PRINCIPAL / LOGIN -->
  <div id="mainScreen" class="app-card">
    <div class="logo-box">DS</div>
    <h2>Don Streaming IPTV</h2>
    <p class="subtitle">Gestión y Activación Remota de Dispositivos</p>

    <div class="nav-tabs">
      <button class="nav-btn active" id="btnTabClient" onclick="switchTab('client')">📱 Mi Dispositivo</button>
      <button class="nav-btn" id="btnTabAdmin" onclick="switchTab('admin')">🔐 Panel Admin (Reseller)</button>
    </div>

    <!-- VISTA CLIENTE -->
    <div id="clientView">
      <div class="device-box">
        <div class="device-row">
          <label>🖥️ MAC del Dispositivo:</label>
          <span id="displayMac">Cargando...</span>
        </div>
        <div class="device-row">
          <label>🔑 Key de Activación:</label>
          <span id="displayKey">---</span>
        </div>
      </div>

      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">
        Entrega esta <b>MAC</b> a tu proveedor Don Streaming para activar tu servicio remotamente.
      </p>

      <button class="btn-action" onclick="comprobarActivacionRemota()">🔄 Verificar Activación</button>
    </div>

    <!-- VISTA ADMIN / RESELLER -->
    <div id="adminView" class="hidden">
      <div id="adminAuth">
        <div class="input-group">
          <label>Clave de Administrador:</label>
          <input type="password" id="adminPass" placeholder="Ingresa clave (Por defecto: 1234)">
        </div>
        <button class="btn-action" onclick="ingresarAdmin()">Acceder al Panel</button>
      </div>

      <div id="adminPanel" class="hidden">
        <div style="background: rgba(99, 102, 241, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
          <small style="color: #818cf8;"><b>Cargar Lista Remota a un Cliente</b></small>
        </div>

        <div class="input-group">
          <label>MAC del Cliente:</label>
          <input type="text" id="targetMac" placeholder="Ej: 00:1A:79:E1:91:06">
        </div>

        <div class="input-group">
          <label>URL M3U / Lista del Cliente:</label>
          <input type="text" id="targetM3u" placeholder="http://servidor.com/get.php?username=...">
        </div>

        <button class="btn-action" style="background: #10b981;" onclick="vincularListaRemota()">⚡ Activar Servicio al Cliente</button>
      </div>
    </div>

    <div id="statusBox" class="status-msg hidden"></div>
  </div>

  <!-- VISTA REPRODUCTOR -->
  <div id="playerView" class="player-view hidden">
    <header class="player-header">
      <button onclick="cerrarReproductor()" class="btn-back">🚪 Salir / Desconectar</button>
      <h3 id="playerTitle">Don Streaming TV</h3>
    </header>

    <div class="player-content">
      <aside class="channel-sidebar">
        <input type="text" id="searchChannel" placeholder="🔍 Buscar canal..." oninput="filtrarCanales()" style="padding:8px; border-radius:6px; border:1px solid #334155; background:#090d16; color:#fff;">
        <div id="channelList" class="channel-list"></div>
      </aside>

      <main class="video-container">
        <video id="videoPlayer" controls autoplay playsinline></video>
        <h4 id="activeChannelName" style="margin-top:10px; color:#94a3b8;">Selecciona un canal para reproducir</h4>
      </main>
    </div>
  </div>

  <script>
    let currentMac = '';
    let currentKey = '';
    let loadedChannels = [];
    let hls = null;

    // 1. INICIALIZAR MAC Y KEY ÚNICAS DEL DISPOSITIVO
    function initDevice() {
      let mac = localStorage.getItem('ds_mac');
      let key = localStorage.getItem('ds_key');

      if (!mac || !key) {
        const hex = '0123456789ABCDEF';
        mac = '00:1A:79:' + Array.from({length: 3}, () => hex[Math.floor(Math.random()*16)] + hex[Math.floor(Math.random()*16)]).join(':');
        key = Math.floor(100000 + Math.random() * 900000).toString();
        localStorage.setItem('ds_mac', mac);
        localStorage.setItem('ds_key', key);
      }

      currentMac = mac;
      currentKey = key;
      document.getElementById('displayMac').innerText = mac;
      document.getElementById('displayKey').innerText = key;
      document.getElementById('targetMac').value = mac; // Auto-rellenar para pruebas en local

      // Auto-comprobar si ya tiene lista vinculada
      comprobarActivacionRemota(true);
    }

    function switchTab(tab) {
      document.getElementById('clientView').classList.toggle('hidden', tab !== 'client');
      document.getElementById('adminView').classList.toggle('hidden', tab !== 'admin');
      document.getElementById('btnTabClient').classList.toggle('active', tab === 'client');
      document.getElementById('btnTabAdmin').classList.toggle('active', tab === 'admin');
      hideStatus();
    }

    function ingresarAdmin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === '1234') { // Puedes cambiar esta clave si gustas
        document.getElementById('adminAuth').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        showStatus('Acceso correcto al Panel Admin', 'success');
      } else {
        showStatus('Clave de administrador incorrecta', 'error');
      }
    }

    // 2. VINCULAR REMOTAMENTE UNA LISTA A UNA MAC
    function vincularListaRemota() {
      const targetMac = document.getElementById('targetMac').value.trim().toUpperCase();
      const targetM3u = document.getElementById('targetM3u').value.trim();

      if (!targetMac || !targetM3u) {
        showStatus('Debes ingresar la MAC y la URL M3U de la lista', 'error');
        return;
      }

      // Guardar vinculación en la base de datos local / registro
      localStorage.setItem('playlist_' + targetMac, targetM3u);
      showStatus(`¡Lista activada correctamente para la MAC: ${targetMac}!`, 'success');

      // Si la MAC coincide con este dispositivo, cargar de una vez
      if (targetMac === currentMac) {
        setTimeout(() => comprobarActivacionRemota(), 1000);
      }
    }

    // 3. COMPROBAR SI LA MAC TIENE LISTA Y CARGARLA
    async function comprobarActivacionRemota(silent = false) {
      const activeM3u = localStorage.getItem('playlist_' + currentMac);

      if (!activeM3u) {
        if (!silent) showStatus('Este dispositivo aún no tiene una lista activada. Solicítala a tu proveedor.', 'error');
        return;
      }

      showStatus('⏳ Cargando lista vinculada...', 'success');

      try {
        // Petición directa
        const response = await fetch(activeM3u);
        if (!response.ok) throw new Error('No se pudo descargar la lista. Verifica la URL.');
        
        const m3uText = await response.text();
        loadedChannels = parseM3U(m3uText);

        if (loadedChannels.length === 0) throw new Error('La lista no contiene canales válidos.');

        abrirReproductor();
      } catch (err) {
        showStatus('Error al cargar contenido: ' + err.message, 'error');
      }
    }

    // PARSER M3U
    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const channels = [];
      let lastExt = null;

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          lastExt = line;
        } else if (line.startsWith('http')) {
          let name = 'Canal de TV';
          if (lastExt) {
            const idx = lastExt.lastIndexOf(',');
            if (idx !== -1) name = lastExt.substring(idx + 1).trim();
          }
          channels.push({ name, url: line });
          lastExt = null;
        }
      });
      return channels;
    }

    // REPRODUCTOR
    function abrirReproductor() {
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('playerView').classList.remove('hidden');
      renderizarListaCanales(loadedChannels);
    }

    function cerrarReproductor() {
      if (hls) hls.destroy();
      document.getElementById('videoPlayer').pause();
      document.getElementById('playerView').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
    }

    function renderizarListaCanales(lista) {
      const container = document.getElementById('channelList');
      container.innerHTML = '';

      lista.slice(0, 150).forEach(item => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.innerText = `📺 ${item.name}`;
        div.onclick = () => reproducirCanal(item, div);
        container.appendChild(div);
      });
    }

    function filtrarCanales() {
      const query = document.getElementById('searchChannel').value.toLowerCase();
      const filtered = loadedChannels.filter(c => c.name.toLowerCase().includes(query));
      renderizarListaCanales(filtered);
    }

    function reproducirCanal(item, element) {
      document.querySelectorAll('.channel-item').forEach(e => e.classList.remove('active'));
      if (element) element.classList.add('active');

      document.getElementById('activeChannelName').innerText = item.name;
      const video = document.getElementById('videoPlayer');

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(item.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = item.url;
        video.play().catch(() => {});
      }
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.innerText = msg;
      box.className = `status-msg ${type === 'success' ? 'status-success' : 'status-error'}`;
      box.classList.remove('hidden');
    }

    function hideStatus() {
      document.getElementById('statusBox').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', initDevice);
  </script>
</body>
</html>
