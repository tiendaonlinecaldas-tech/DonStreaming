<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming IPTV</title>
  
  <!-- HLS Player -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #080c14; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .hidden { display: none !important; }

    .app-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .logo-box {
      width: 70px; height: 70px; margin: 0 auto 12px auto;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      border-radius: 18px; display: flex; justify-content: center; align-items: center;
      font-size: 26px; font-weight: 900; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    h2 { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    .subtitle { font-size: 12px; color: #64748b; margin-bottom: 15px; }

    .nav-tabs { display: flex; gap: 5px; margin-bottom: 18px; background: #1e293b; padding: 4px; border-radius: 10px; }
    .nav-btn { flex: 1; padding: 8px 5px; border: none; background: transparent; color: #94a3b8; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 11px; }
    .nav-btn.active { background: #6366f1; color: #ffffff; }

    .device-box { background: rgba(30, 41, 59, 0.6); border: 2px dashed #38bdf8; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
    .device-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .device-row:last-child { margin-bottom: 0; }
    .device-row label { color: #94a3b8; font-size: 12px; }
    .device-row span { color: #38bdf8; font-family: monospace; font-size: 15px; font-weight: bold; }

    .input-group { text-align: left; margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; font-size: 12px; }

    .btn-action { width: 100%; padding: 11px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border: none; border-radius: 9px; color: #fff; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 5px; }

    .status-msg { margin-top: 12px; padding: 8px; border-radius: 8px; font-size: 11px; word-break: break-all; }
    .status-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .status-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }

    /* REPRODUCTOR */
    .player-view { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #000; position: fixed; top: 0; left: 0; z-index: 999; }
    .player-header { padding: 10px 18px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .btn-back { background: #ef4444; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .player-content { display: flex; flex: 1; overflow: hidden; }
    .channel-sidebar { width: 300px; background: #0f172a; padding: 12px; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
    .channel-list { flex: 1; overflow-y: auto; margin-top: 10px; }
    .channel-item { padding: 10px; border-radius: 6px; cursor: pointer; background: rgba(255,255,255,0.03); margin-bottom: 5px; font-size: 12px; text-align: left; }
    .channel-item:hover, .channel-item.active { background: #6366f1; color: #fff; font-weight: bold; }
    .video-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; padding: 15px; }
    video { width: 100%; max-height: 80vh; background: #050505; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="mainScreen" class="app-card">
    <div class="logo-box">DS</div>
    <h2>Don Streaming IPTV</h2>
    <p class="subtitle">Plataforma Multidispositivo de Reproducción</p>

    <div class="nav-tabs">
      <button class="nav-btn active" id="btnTabMac" onclick="switchMainTab('mac')">📱 Activación por MAC</button>
      <button class="nav-btn" id="btnTabDirect" onclick="switchMainTab('direct')">🔑 Ingreso Directo</button>
      <button class="nav-btn" id="btnTabAdmin" onclick="switchMainTab('admin')">🔐 Panel Admin</button>
    </div>

    <!-- VISTA MAC -->
    <div id="macView">
      <div class="device-box">
        <div class="device-row">
          <label>🖥️ MAC Dispositivo:</label>
          <span id="displayMac">Cargando...</span>
        </div>
        <div class="device-row">
          <label>🔑 Key Activación:</label>
          <span id="displayKey">572290</span>
        </div>
      </div>
      <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">
        Envía esta MAC a tu proveedor para activar tu servicio. Una vez activado, presiona el botón inferior.
      </p>
      <button class="btn-action" onclick="comprobarActivacionMacRemota()">🔄 Verificar / Cargar Lista Remota</button>
    </div>

    <!-- INGRESO DIRECTO -->
    <div id="directView" class="hidden">
      <div class="input-group">
        <label>URL M3U de la Lista:</label>
        <input type="text" id="directM3uUrl" placeholder="http://aioplus.es:80/playlist/USUARIO/CLAVE/m3u">
      </div>
      <button class="btn-action" onclick="conectarM3uDirecto()">🚀 Entrar con URL Directa</button>
    </div>

    <!-- PANEL ADMIN -->
    <div id="adminView" class="hidden">
      <div id="adminAuth">
        <div class="input-group">
          <label>Clave de Administrador:</label>
          <input type="password" id="adminPass" placeholder="1234">
        </div>
        <button class="btn-action" onclick="ingresarAdmin()">Acceder al Panel</button>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="input-group">
          <label>MAC del Cliente a Activar:</label>
          <input type="text" id="targetMac" placeholder="00:1A:79:E1:91:06">
        </div>
        <div class="input-group">
          <label>URL M3U o Xtream Link:</label>
          <input type="text" id="targetM3u" placeholder="http://aioplus.es:80/playlist/USUARIO/CLAVE/m3u">
        </div>
        <button class="btn-action" style="background: #10b981;" onclick="vincularListaRemotaCloud()">⚡ Activar / Guardar en Nube</button>
      </div>
    </div>

    <div id="statusBox" class="status-msg hidden"></div>
  </div>

  <!-- REPRODUCTOR -->
  <div id="playerView" class="player-view hidden">
    <header class="player-header">
      <h3 id="playerTitle">📺 Don Streaming Player</h3>
      <button onclick="cerrarReproductor()" class="btn-back">🚪 Salir / Desconectar</button>
    </header>

    <div class="player-content">
      <aside class="channel-sidebar">
        <input type="text" id="searchChannel" placeholder="🔍 Buscar canal..." oninput="filtrarCanales()" style="padding:8px; border-radius:6px; border:1px solid #334155; background:#090d16; color:#fff; width:100%;">
        <div id="channelList" class="channel-list"></div>
      </aside>

      <main class="video-container">
        <video id="videoPlayer" controls autoplay playsinline></video>
        <h4 id="activeChannelName" style="margin-top:12px; color:#38bdf8;">Selecciona un canal para reproducir</h4>
      </main>
    </div>
  </div>

  <script>
    // CONFIGURACIÓN DE FIREBASE (YA INCLUIDA)
    const firebaseConfig = {
      apiKey: "AIzaSyAqCNZM3l0f0Kk0KwywXyY-0qXsH6ZqA4",
      authDomain: "donstreaming-6c348.firebaseapp.com",
      databaseURL: "https://donstreaming-6c348-default-rtdb.firebaseio.com",
      projectId: "donstreaming-6c348",
      storageBucket: "donstreaming-6c348.firebasestorage.app",
      messagingSenderId: "97294831410",
      appId: "1:97294831410:web:be16b2b17203224e50512b"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) { console.log("Error al iniciar Firebase", e); }

    let currentDeviceMac = '';
    let loadedChannels = [];
    let hls = null;

    function obtenerMacUnicaDispositivo() {
      let mac = localStorage.getItem('ds_device_mac');
      if (!mac) {
        const hexDigits = "0123456789ABCDEF";
        let macArr = ["00", "1A", "79"];
        for (let i = 0; i < 3; i++) {
          macArr.push(hexDigits.charAt(Math.floor(Math.random() * 16)) + hexDigits.charAt(Math.floor(Math.random() * 16)));
        }
        mac = macArr.join(":");
        localStorage.setItem('ds_device_mac', mac);
      }
      return mac;
    }

    function initDevice() {
      currentDeviceMac = obtenerMacUnicaDispositivo();
      document.getElementById('displayMac').innerText = currentDeviceMac;
      document.getElementById('targetMac').value = currentDeviceMac;
    }

    function switchMainTab(tab) {
      document.getElementById('macView').classList.toggle('hidden', tab !== 'mac');
      document.getElementById('directView').classList.toggle('hidden', tab !== 'direct');
      document.getElementById('adminView').classList.toggle('hidden', tab !== 'admin');

      document.getElementById('btnTabMac').classList.toggle('active', tab === 'mac');
      document.getElementById('btnTabDirect').classList.toggle('active', tab === 'direct');
      document.getElementById('btnTabAdmin').classList.toggle('active', tab === 'admin');
      hideStatus();
    }

    async function comprobarActivacionMacRemota() {
      const macLimpia = currentDeviceMac.replace(/:/g, '');
      showStatus('⏳ Verificando activación en la nube...', 'success');

      if (db) {
        db.ref('activaciones/' + macLimpia).once('value').then(snapshot => {
          const url = snapshot.val();
          if (url) {
            document.getElementById('directM3uUrl').value = url;
            conectarM3uDirecto();
          } else {
            showStatus('⚠️ MAC no activada. Por favor envía tu MAC al administrador.', 'error');
          }
        }).catch(err => {
          showStatus('Error al consultar Firebase.', 'error');
        });
      } else {
        showStatus('Error de conexión a la base de datos.', 'error');
      }
    }

    function vincularListaRemotaCloud() {
      const targetMac = document.getElementById('targetMac').value.trim().toUpperCase();
      const targetM3u = document.getElementById('targetM3u').value.trim();

      if (!targetMac || !targetM3u) return showStatus('Ingresa la MAC y la URL M3U', 'error');

      const macLimpia = targetMac.replace(/:/g, '');

      if (db) {
        db.ref('activaciones/' + macLimpia).set(targetM3u, (error) => {
          if (error) {
            showStatus('Error guardando en nube: ' + error.message, 'error');
          } else {
            showStatus(`✅ ¡MAC ${targetMac} activada exitosamente en la nube!`, 'success');
          }
        });
      }
    }

    function parseXtreamFromUrl(url) {
      try {
        const u = new URL(url);
        const parts = u.pathname.split('/');
        if (parts.length >= 4 && parts[1] === 'playlist') {
          return { host: `${u.protocol}//${u.host}`, user: parts[2], pass: parts[3] };
        }
      } catch (e) {}
      return null;
    }

    async function solicitarUrl(targetUrl) {
      const endpoints = [
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
      ];

      for (let proxy of endpoints) {
        try {
          const res = await fetch(proxy);
          if (res.ok) {
            const data = await res.text();
            if (data && data.length > 50) return data;
          }
        } catch (e) {}
      }
      return null;
    }

    async function conectarM3uDirecto() {
      const url = document.getElementById('directM3uUrl').value.trim();
      if (!url) return showStatus('Ingresa una URL válida', 'error');

      showStatus('⏳ Descargando canales...', 'success');

      const xtreamData = parseXtreamFromUrl(url);
      if (xtreamData) {
        const jsonUrl = `${xtreamData.host}/player_api.php?username=${xtreamData.user}&password=${xtreamData.pass}&action=get_live_streams`;
        const jsonText = await solicitarUrl(jsonUrl);
        if (jsonText) {
          try {
            const streams = JSON.parse(jsonText);
            if (Array.isArray(streams) && streams.length > 0) {
              loadedChannels = streams.map(s => ({
                name: s.name,
                url: `${xtreamData.host}/live/${xtreamData.user}/${xtreamData.pass}/${s.stream_id}.m3u8`
              }));
              showStatus(`¡Éxito! ${loadedChannels.length} canales cargados.`, 'success');
              setTimeout(() => abrirReproductor(), 600);
              return;
            }
          } catch(e) {}
        }
      }

      const m3uText = await solicitarUrl(url);
      if (m3uText) {
        loadedChannels = parseM3U(m3uText);
        if (loadedChannels.length > 0) {
          showStatus(`¡Éxito! ${loadedChannels.length} canales cargados.`, 'success');
          setTimeout(() => abrirReproductor(), 600);
          return;
        }
      }

      showStatus('Error: No se pudo cargar la lista. Verifica que esté activa.', 'error');
    }

    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const channels = [];
      let lastExt = null;

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          lastExt = line;
        } else if (line.startsWith('http')) {
          let name = 'Canal sin nombre';
          if (lastExt) {
            const idx = lastExt.lastIndexOf(',');
            if (idx !== -1) name = lastExt.substring(idx + 1).trim();
          }
          channels.push({ name, url: line });
          lastExt = null;
        }
      });
      return channels;
    }

    function ingresarAdmin() {
      if (document.getElementById('adminPass').value === '1234') {
        document.getElementById('adminAuth').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        showStatus('Acceso concedido', 'success');
      } else {
        showStatus('Clave incorrecta', 'error');
      }
    }

    function abrirReproductor() {
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('playerView').classList.remove('hidden');
      renderizarListaCanales(loadedChannels);
    }

    function cerrarReproductor() {
      if (hls) hls.destroy();
      document.getElementById('videoPlayer').pause();
      document.getElementById('playerView').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
    }

    function renderizarListaCanales(lista) {
      const container = document.getElementById('channelList');
      container.innerHTML = '';
      lista.slice(0, 300).forEach(item => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.innerText = `📺 ${item.name}`;
        div.onclick = () => reproducirCanal(item, div);
        container.appendChild(div);
      });
    }

    function filtrarCanales() {
      const query = document.getElementById('searchChannel').value.toLowerCase();
      const filtered = loadedChannels.filter(c => c.name.toLowerCase().includes(query));
      renderizarListaCanales(filtered);
    }

    function reproducirCanal(item, element) {
      document.querySelectorAll('.channel-item').forEach(e => e.classList.remove('active'));
      if (element) element.classList.add('active');
      document.getElementById('activeChannelName').innerText = item.name;
      const video = document.getElementById('videoPlayer');

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(item.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = item.url;
        video.play().catch(() => {});
      }
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.innerText = msg;
      box.className = `status-msg ${type === 'success' ? 'status-success' : 'status-error'}`;
      box.classList.remove('hidden');
    }

    function hideStatus() {
      document.getElementById('statusBox').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', initDevice);
  </script>
</body>
</html>
