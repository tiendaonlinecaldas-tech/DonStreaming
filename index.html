<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming IPTV</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <img src="logo.png" alt="Don Streaming" class="login-logo">
      <h2>Don Streaming IPTV</h2>
      <p>Plataforma de reproducción streaming</p>

      <form id="loginForm" onsubmit="iniciarSesion(event)">
        <div class="input-group">
          <label>URL del Servidor / DNS</label>
          <input type="text" id="serverUrl" placeholder="http://dominio.com:80" required>
        </div>
        <div class="input-group">
          <label>Usuario IPTV</label>
          <input type="text" id="username" placeholder="Usuario" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn-login">🚀 Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL (ESTILO IPTV SMARTERS) -->
  <div id="appContainer" class="app-container hidden">
    <!-- ENCABEZADO SUPERIOR -->
    <header class="top-bar">
      <div class="brand-box">
        <img src="logo.png" alt="Don Streaming" class="header-logo">
        <span class="brand-title">Don Streaming</span>
      </div>
      <div class="info-box">
        <span id="clockDisplay">12:00 PM</span>
        <span id="expDisplay">Expiration: --</span>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <!-- GRILLA DE DASHBOARD -->
    <main class="smarters-grid">
      <!-- BOTÓN LIVE TV -->
      <div class="tile tile-live" onclick="abrirSeccion('live')">
        <div class="tile-icon">📺</div>
        <div class="tile-title">LIVE TV</div>
      </div>

      <!-- BOTÓN MOVIES -->
      <div class="tile tile-movies" onclick="abrirSeccion('vod')">
        <div class="tile-icon">🎬</div>
        <div class="tile-title">MOVIES</div>
      </div>

      <!-- BOTÓN SERIES -->
      <div class="tile tile-series" onclick="abrirSeccion('series')">
        <div class="tile-icon">🎞️</div>
        <div class="tile-title">SERIES</div>
      </div>

      <!-- BOTÓN CATCH UP -->
      <div class="tile tile-small" onclick="abrirSeccion('catchup')">
        <div class="tile-icon">⏱️</div>
        <div class="tile-title-small">CATCH UP</div>
      </div>

      <!-- BOTÓN MULTISCREEN -->
      <div class="tile tile-small" onclick="abrirSeccion('multiscreen')">
        <div class="tile-icon">🖥️</div>
        <div class="tile-title-small">MULTISCREEN</div>
      </div>

      <!-- BOTÓN SETTINGS -->
      <div class="tile tile-small" onclick="abrirSeccion('settings')">
        <div class="tile-icon">⚙️</div>
        <div class="tile-title-small">SETTINGS</div>
      </div>
    </main>

    <!-- FOOTER USUARIO -->
    <footer class="footer-bar">
      <span id="userLogged">Logged in : --</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
